name: Generate Snake Animation

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-light.svg?color_snake=%239d5ce6&color_dots=%23d6def2,%23bfdbfe,%2393c5fd,%233b82f6,%231e40af&color_background=%23eef2fb
            dist/github-snake-dark.svg?color_snake=%238b5cf6&color_dots=%23313244,%231e3a8a,%232563eb,%2360a5fa,%239cc9fd&color_background=%231e1e2e

      - name: Push changes
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
